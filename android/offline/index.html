<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YouPlay — Моя музыка</title>
<link rel="stylesheet" href="offline.css">
</head>
<body>
<div id="bg"><div id="bg-art"></div></div>

<header id="top">
  <div class="brand">YouPlay</div>
  <button id="online-btn" class="pill" hidden>YouTube Music</button>
</header>

<div id="net" hidden>
  <svg viewBox="0 0 24 24"><path d="M2.3 8.6a14 14 0 0 1 19.4 0l-1.6 1.6a11.7 11.7 0 0 0-16.2 0zm3.3 3.3a9.3 9.3 0 0 1 12.8 0l-1.6 1.6a7 7 0 0 0-9.6 0zM12 15.8a2.3 2.3 0 1 1 0 4.6 2.3 2.3 0 0 1 0-4.6z"/></svg>
  <div><b id="net-title">Нет подключения к интернету</b><small id="net-sub">Играет музыка с вашего телефона — YouPlay работает и без сети</small></div>
  <button id="retry" class="pill">Повторить</button>
</div>

<main id="main">
  <section class="head">
    <small>Без интернета</small>
    <h1>Моя музыка</h1>
    <p id="count">Ищу музыку на телефоне…</p>
    <div class="btns">
      <button id="play-all" class="primary"><svg viewBox="0 0 24 24"><path d="M8 5.7c0-.8.9-1.3 1.6-.9l9.6 6.3c.6.4.6 1.4 0 1.8l-9.6 6.3c-.7.4-1.6-.1-1.6-.9z"/></svg>Слушать</button>
      <button id="shuffle-all" class="ghost"><svg viewBox="0 0 24 24"><path d="M16 4h4v4M4 19 20 4M20 16v4h-4M14.5 14.5 20 20M4 5l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Перемешать</button>
    </div>
    <div class="tabs"><button data-f="all" class="on">Все</button><button data-f="fav">Избранное</button><button data-f="recent">Недавние</button></div>
    <input id="filter" type="search" placeholder="Поиск по трекам, исполнителям, альбомам">
  </section>
  <section id="list"></section>
  <div id="perm" hidden>
    <p>Чтобы играть музыку с телефона, разрешите YouPlay доступ к аудиофайлам.</p>
    <button id="perm-btn" class="primary">Разрешить доступ</button>
  </div>
</main>

<div id="mini" hidden>
  <i class="bar"></i>
  <img id="mini-art" alt="">
  <div class="meta"><b id="mini-title"></b><small id="mini-artist"></small></div>
  <button id="mini-play" class="icon"></button>
  <button id="mini-next" class="icon"><svg viewBox="0 0 24 24"><path d="M17.5 5.5a1 1 0 0 1 1 1v11a1 1 0 1 1-2 0v-11a1 1 0 0 1 1-1zM5.6 6.1a1 1 0 0 0-.6.9v10a1 1 0 0 0 1.6.8l7-5a1 1 0 0 0 0-1.6l-7-5a1 1 0 0 0-1-.1z"/></svg></button>
</div>

<section id="np" aria-hidden="true">
  <div class="np-top">
    <button id="np-close" class="icon"><svg viewBox="0 0 24 24"><path d="M7.4 8.6 12 13.2l4.6-4.6L18 10l-6 6-6-6z"/></svg></button>
    <span>Моя музыка</span>
    <button id="np-sleep" class="icon" title="Таймер сна"><svg viewBox="0 0 24 24"><path d="M20 15.3A8.5 8.5 0 0 1 8.7 4a8.5 8.5 0 1 0 11.3 11.3z"/></svg></button>
  </div>
  <img id="np-art" alt="">
  <div class="np-meta">
    <div><b id="np-title"></b><small id="np-artist"></small><span class="badge">На телефоне</span></div>
    <button id="np-like" class="round"></button>
  </div>
  <div id="seek"><i class="fill"></i><i class="knob"></i></div>
  <div class="times"><span id="t-cur">0:00</span><span id="t-dur">0:00</span></div>
  <div class="ctrl">
    <button id="c-shuffle" class="icon"><svg viewBox="0 0 24 24"><path d="M16 4h4v4M4 19 20 4M20 16v4h-4M14.5 14.5 20 20M4 5l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    <button id="c-prev" class="icon"><svg viewBox="0 0 24 24"><path d="M6.5 5.5a1 1 0 0 1 1 1v11a1 1 0 1 1-2 0v-11a1 1 0 0 1 1-1zM18.4 6.1a1 1 0 0 1 .6.9v10a1 1 0 0 1-1.6.8l-7-5a1 1 0 0 1 0-1.6l7-5a1 1 0 0 1 1-.1z"/></svg></button>
    <button id="c-play" class="play"></button>
    <button id="c-next" class="icon"><svg viewBox="0 0 24 24"><path d="M17.5 5.5a1 1 0 0 1 1 1v11a1 1 0 1 1-2 0v-11a1 1 0 0 1 1-1zM5.6 6.1a1 1 0 0 0-.6.9v10a1 1 0 0 0 1.6.8l7-5a1 1 0 0 0 0-1.6l-7-5a1 1 0 0 0-1-.1z"/></svg></button>
    <button id="c-repeat" class="icon"><svg viewBox="0 0 24 24"><path d="M17 3l3 3-3 3M4 12v-1.5A4.5 4.5 0 0 1 8.5 6H20M7 21l-3-3 3-3M20 12v1.5a4.5 4.5 0 0 1-4.5 4.5H4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
  <div id="sleep-label" class="chip" hidden></div>
</section>

<div id="toast"></div>
<audio id="audio" preload="auto"></audio>
<script src="offline.js"></script>
</body>
</html>
